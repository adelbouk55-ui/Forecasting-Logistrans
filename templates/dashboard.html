<!DOCTYPE html>
<html>
<head>
    <title>AI Logistics Dashboard</title>
    <style>
        body { font-family: Arial; background:#f4f4f4; text-align:center; }
        .card {
            background:white;
            padding:20px;
            margin:20px;
            border-radius:10px;
            display:inline-block;
            width:200px;
        }
    </style>
</head>

<body>

<h1>🚀 AI Supply Chain Dashboard</h1>

<div class="card">
    <h3>Total Demand</h3>
    <p>{{data.total_demand}}</p>
</div>

<div class="card">
    <h3>Average</h3>
    <p>{{data.avg}}</p>
</div>

<div class="card">
    <h3>Status</h3>
    <p>{{data.status}}</p>
</div>

</body>
</html>
